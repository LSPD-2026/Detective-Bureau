<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C.I.U. — Portail d'Accès — L.S.P.D.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
body{background:var(--navy);}
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 20px;position:relative;overflow:hidden;
}
#login-screen::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 50% -10%, rgba(241,164,0,0.08), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
  pointer-events:none;
}
.login-wrap{position:relative;z-index:1;width:100%;max-width:430px;}
.login-seal{display:flex;flex-direction:column;align-items:center;margin-bottom:26px;text-align:center;}
.login-seal img{width:92px;height:92px;object-fit:contain;margin-bottom:14px;filter:drop-shadow(0 4px 18px rgba(0,0,0,0.5));}
.login-seal .org{font-family:var(--font-mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
.login-seal h1{font-family:var(--font-display);font-size:26px;color:var(--cream);line-height:1.15;margin:0 0 6px;}
.login-seal .sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tan-dim);}

.login-card{background:var(--cream);border:1px solid var(--ink);box-shadow:0 24px 70px rgba(0,0,0,0.45);}
.login-card-bar{height:5px;background:linear-gradient(90deg,var(--gold-dim),var(--gold),var(--gold-dim));}
.login-card-body{padding:30px 30px 26px;}
.login-warn{
  display:flex;gap:9px;align-items:flex-start;margin-bottom:22px;
  padding:10px 13px;background:rgba(139,26,26,0.06);border:1px solid rgba(139,26,26,0.22);border-left:3px solid var(--red);
}
.login-warn span{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--red);line-height:1.5;}
.login-err{
  margin-top:14px;padding:10px 13px;background:rgba(139,26,26,0.07);border:1px solid rgba(139,26,26,0.25);
  border-left:3px solid var(--red);font-family:var(--font-mono);font-size:11.5px;color:var(--red);display:none;
}
.login-err.show{display:block;}
.login-btn{
  width:100%;background:var(--navy);color:var(--gold-light);border:2px solid var(--navy);
  padding:13px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;
  cursor:pointer;margin-top:6px;transition:all .18s;
}
.login-btn:hover{background:var(--gold);color:var(--navy);border-color:var(--gold-dim);}
.login-btn:disabled{opacity:.55;cursor:wait;}
.login-card-foot{
  border-top:1px solid var(--divider);padding:13px 30px;
  font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--gray);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;
}
#loader-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;font-family:var(--font-mono);font-size:10px;color:var(--tan-dim);display:none;}
#loader-row.show{display:flex;}
.spin{width:11px;height:11px;border:2px solid var(--tan-dim);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-wrap">
    <div class="login-seal">
      <img src="ciu_logo.png" alt="C.I.U." onerror="this.style.display='none'">
      <div class="org">Los Santos Police Department</div>
      <h1>Criminal Investigation<br>Union</h1>
      <div class="sub">Portail Interne — Bureau des Inspecteurs</div>
    </div>

    <div class="login-card">
      <div class="login-card-bar"></div>
      <div class="login-card-body">
        <div class="login-warn"><span>⚠ Accès restreint — Personnel autorisé uniquement. Toute tentative non autorisée est consignée.</span></div>

        <div class="field">
          <label for="login-email">Adresse e-mail institutionnelle</label>
          <input id="login-email" type="email" placeholder="prenom.nom@gmail.com" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('login-pw').focus()">
        </div>
        <div class="field" style="margin-bottom:6px;">
          <label for="login-pw">Code d'accès</label>
          <input id="login-pw" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        </div>

        <button class="login-btn" id="login-btn" onclick="doLogin()">Connexion — Système C.I.U.</button>
        <div class="login-err" id="login-err"></div>
        <div id="loader-row"><div class="spin"></div><span id="loader-txt">Authentification...</span></div>
      </div>
      <div class="login-card-foot">
        <span>© L.S.P.D. — Criminal Investigation Union</span>
        <span>Usage interne — San Andreas</span>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="shared.js"></script>
<script>
let _fbReady=false;

(async function boot(){
  // Si déjà connecté → direct vers l'accueil
  const sess = CIU.loadSess();
  if(sess){ window.location.href='accueil.html'; return; }
})();

function setLoading(on, msg){
  const row=document.getElementById('loader-row');
  const btn=document.getElementById('login-btn');
  row.classList.toggle('show', on);
  if(msg) document.getElementById('loader-txt').textContent=msg;
  btn.disabled = on;
}
function showErr(msg){
  const el=document.getElementById('login-err');
  el.textContent = '✕ '+msg;
  el.classList.add('show');
}
function hideErr(){ document.getElementById('login-err').classList.remove('show'); }

async function doLogin(){
  hideErr();
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pw = document.getElementById('login-pw').value;
  if(!email || !pw){ showErr('Renseignez votre identifiant et votre mot de passe.'); return; }

  setLoading(true, 'Connexion à Firebase...');

  // Init firebase + charger users
  const ok = (typeof firebase!=='undefined') && (function(){
    try{
      if(!firebase.apps.length) firebase.initializeApp({
        apiKey:"AIzaSyDjFtSaDCRnBh2rqQezLOAFyvBA6aV2Mds",
        authDomain:"ciu-portal.firebaseapp.com",
        projectId:"ciu-portal",
        storageBucket:"ciu-portal.firebasestorage.app",
        messagingSenderId:"1072590977967",
        appId:"1:1072590977967:web:4d1b0b8b3a6bdcfb208d5a"
      });
      return true;
    }catch(e){ return false; }
  })();

  if(!ok){ setLoading(false); showErr('Impossible de se connecter à Firebase.'); return; }

  const fdb = firebase.firestore();
  const fauth = firebase.auth();

  setLoading(true, 'Authentification...');

  // 1. Essayer Firebase Auth
  let authOk = false;
  try{
    await fauth.signInWithEmailAndPassword(email, pw);
    authOk = true;
  }catch(authErr){
    const notFound = ['auth/user-not-found','auth/invalid-credential','auth/wrong-password','auth/invalid-email'].includes(authErr.code);
    if(!notFound){
      setLoading(false);
      showErr(authErr.code==='auth/too-many-requests' ? 'Trop de tentatives. Réessayez dans quelques minutes.' : 'Identifiant ou mot de passe incorrect.');
      return;
    }
  }

  if(!authOk){
    // 2. Fallback local
    setLoading(true, 'Vérification locale...');
    let users = {};
    try{
      const snap = await fdb.collection('config').doc('main').get();
      if(snap.exists) users = snap.data().users || {};
    }catch(e){}
    const u = users[email];
    if(!u){ setLoading(false); showErr('Identifiant ou mot de passe incorrect.'); return; }

    async function sha256(str){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
    let pwOk=false;
    if(!u.pw){ pwOk = pw.length>=4; }
    else if(u.pw.length===64 && /^[0-9a-f]+$/.test(u.pw)){ pwOk = (await sha256(pw))===u.pw; }
    else { pwOk = pw===u.pw; }

    if(!pwOk){ setLoading(false); showErr('Identifiant ou mot de passe incorrect.'); return; }
  }

  // Connexion réussie → sauver session + rediriger
  localStorage.setItem('ciu_sess_v2', JSON.stringify({email, ts: Date.now()}));
  setLoading(true, 'Accès autorisé — Redirection...');
  setTimeout(()=>{ window.location.href='accueil.html'; }, 400);
}
</script>
</body>
</html>
