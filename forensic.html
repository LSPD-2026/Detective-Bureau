<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSPD — Lecteur de Rapports Forensiques</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#07091a;--bg2:#0b0f20;--bg3:#101828;
  --panel:#111827;--panel2:#1a2236;
  --border:#1a2a42;--border2:#1e3050;
  --cyan:#00b4d8;--cyan2:#0077a8;
  --cyan-dim:rgba(0,180,216,0.09);--cyan-glow:rgba(0,180,216,0.15);
  --green:#00e676;--green-dim:rgba(0,230,118,0.09);
  --orange:#ffab40;--orange-dim:rgba(255,171,64,0.09);
  --red:#ef5350;--red-dim:rgba(239,83,80,0.09);
  --text:#a8c0d8;--text2:#5a7a96;--text3:#304a60;
  --white:#d8eeff;
  --mono:'Share Tech Mono',monospace;
  --ui:'Rajdhani',sans-serif;
  --body:'Exo 2',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--body);}

/* DESKTOP */
#desktop{width:100%;height:100%;background:radial-gradient(ellipse 70% 80% at 10% 60%,#0c1830 0%,#07091a 60%);position:relative;overflow:hidden;}
#desktop-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;}
#desktop-bg img{width:440px;height:440px;object-fit:contain;opacity:0.12;}
.d-icon{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:8px 10px;border-radius:5px;transition:background .15s;user-select:none;width:80px;z-index:2;}
.d-icon:hover{background:rgba(0,180,216,0.1);}
.d-icon:active{background:rgba(0,180,216,0.18);}
.d-icon img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,180,216,0.25));}
.d-icon span{font-family:var(--mono);font-size:9px;color:var(--text2);text-align:center;line-height:1.4;}

/* ── READER STYLES ──────────────────────────────── */
.rdr-empty{font-family:var(--mono);font-size:10px;color:#b0a08a;text-align:center;padding:60px 40px;line-height:2.4;}
.rdr-print-btn{display:block;width:calc(100% - 40px);max-width:1000px;margin:20px auto 0;padding:11px;background:#1a2236;color:#00b4d8;border:1px solid #243555;font-family:'Courier New',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .15s;border-radius:2px;text-align:center;}
.rdr-print-btn:hover{background:#243555;}
/* Doc wrapper */
.rdr-doc{padding:24px 20px 40px;background:#f4f1eb;min-height:100%;font-family:'Georgia',serif;color:#1a1a1a;}
/* En-tête */
.rdr-top{background:#fff;border:1px solid #ccc;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.rdr-top-logos{display:flex;align-items:center;justify-content:center;gap:20px;padding:20px 30px 14px;}
.rdr-logo{width:64px;height:64px;object-fit:contain;flex-shrink:0;}
.rdr-top-text{text-align:center;flex:1;}
.rdr-top-title{font-family:'Georgia',serif;font-size:17px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#0a0a0a;}
.rdr-top-sub{font-family:'Georgia',serif;font-size:10px;color:#555;letter-spacing:.06em;margin-top:2px;}
.rdr-top-divider{height:2px;background:#1a1a1a;margin:0 24px;}
.rdr-ref-box{text-align:center;padding:12px 24px;background:#f9f7f2;border-top:1px solid #ddd;}
.rdr-ref-label{font-family:'Courier New',monospace;font-size:11px;color:#666;letter-spacing:.1em;margin-right:8px;}
.rdr-ref-num{font-family:'Courier New',monospace;font-size:13px;font-weight:700;letter-spacing:.12em;color:#0a0a0a;}
/* Grille principale */
.rdr-main-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
/* Cards */
.rdr-card{background:#fff;border:1px solid #ccc;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.rdr-card-full{grid-column:1/-1;}
.rdr-card-label{font-family:'Courier New',monospace;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#666;border-bottom:1px solid #e0ddd6;padding-bottom:8px;margin-bottom:14px;}
/* Grille interne objet */
.rdr-card-grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.rdr-field-lbl{font-family:'Courier New',monospace;font-size:8px;color:#888;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;}
.rdr-field-val{font-family:'Georgia',serif;font-size:13px;color:#111;font-weight:500;}
.rdr-coords{font-family:'Courier New',monospace;font-size:11px;color:#5a3e00;}
.rdr-quality{font-family:'Courier New',monospace;font-size:14px;color:#1a6b1a;font-weight:700;}
/* Résultat */
.rdr-card-result{border-left:4px solid #ccc;}
.rdr-card-match{border-left-color:#1a6b1a;background:#f4fff6;}
.rdr-card-nomatch{border-left-color:#8b2000;background:#fff8f6;}
.rdr-result-inner{display:flex;align-items:center;gap:16px;padding:6px 0;}
.rdr-result-icon{font-size:32px;font-weight:700;line-height:1;flex-shrink:0;}
.rdr-card-match .rdr-result-icon{color:#1a6b1a;}
.rdr-card-nomatch .rdr-result-icon{color:#8b2000;}
.rdr-result-label{font-family:'Courier New',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#666;margin-bottom:5px;}
.rdr-result-val{font-family:'Georgia',serif;font-size:15px;font-weight:700;}
.rdr-card-match .rdr-result-val{color:#1a6b1a;}
.rdr-card-nomatch .rdr-result-val{color:#8b2000;}
/* Analyste */
.rdr-analyst{font-family:'Georgia',serif;font-size:15px;font-weight:700;color:#111;margin-bottom:3px;}
.rdr-analyst-title{font-family:'Courier New',monospace;font-size:9px;color:#888;letter-spacing:.1em;text-transform:uppercase;}
/* Chaine */
.rdr-custody-badge{display:inline-block;background:#f0f8f0;border:1px solid #4caf50;color:#1a6b1a;font-family:'Courier New',monospace;font-size:9px;letter-spacing:.1em;padding:4px 12px;margin-bottom:12px;border-radius:2px;}
.rdr-chain-list{display:flex;flex-direction:column;gap:0;}
.rdr-chain-item{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px solid #eee;}
.rdr-chain-item:last-child{border-bottom:none;}
.rdr-chain-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.rdr-chain-collecte .rdr-chain-dot{background:#0077a8;}
.rdr-chain-analyse .rdr-chain-dot{background:#1a6b1a;}
.rdr-chain-match .rdr-chain-dot{background:#b5821a;}
.rdr-chain-type{font-family:'Courier New',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;min-width:70px;color:#555;margin-top:2px;}
.rdr-chain-txt{font-family:'Courier New',monospace;font-size:10px;color:#333;line-height:1.6;}
/* Légal */
.rdr-legal-txt{font-family:'Georgia',serif;font-size:12px;color:#555;line-height:1.8;font-style:italic;}
/* Signature */
.rdr-sig-section{background:#fff;border:1px solid #ccc;padding:18px 24px;display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.rdr-sig-city{font-family:'Georgia',serif;font-size:12px;color:#555;}
.rdr-sig-right{text-align:right;}
.rdr-sig-name{font-family:'Georgia',serif;font-size:15px;font-weight:700;color:#111;margin-bottom:3px;}
.rdr-sig-title{font-family:'Courier New',monospace;font-size:9px;color:#888;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;}
.rdr-sig-ref{font-family:'Courier New',monospace;font-size:10px;color:#aaa;}
/* Pied de page centré */
.rdr-footer{background:#1a1a1a;padding:14px 24px;text-align:center;}
.rdr-footer-line1{font-family:'Courier New',monospace;font-size:10px;color:#c0b89a;letter-spacing:.08em;margin-bottom:4px;}
.rdr-footer-line2{font-family:'Courier New',monospace;font-size:9px;color:#666;letter-spacing:.06em;}
@media print{.rdr-print-btn{display:none!important;}.rdr-doc{background:#fff!important;}.rdr-card{box-shadow:none!important;}}
#taskbar{position:fixed;bottom:0;left:0;right:0;height:36px;background:#030608;border-top:1px solid #0f1a2a;display:flex;align-items:center;padding:0 6px;gap:2px;z-index:9999;}
.tb-btn{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:3px;cursor:pointer;font-family:var(--mono);font-size:10px;color:var(--text2);border:1px solid transparent;transition:all .15s;}
.tb-btn:hover{background:rgba(255,255,255,0.03);}
.tb-btn.active{background:rgba(0,180,216,0.08);border-color:#1a2e44;color:var(--cyan);}
.tb-btn img{width:14px;height:14px;object-fit:contain;}
.tb-sep{width:1px;height:18px;background:#0f1a2a;margin:0 4px;}
.tb-right{margin-left:auto;display:flex;gap:12px;align-items:center;padding-right:8px;font-family:var(--mono);font-size:9px;}
#tb-clock{color:var(--text2);}
#tb-date{color:var(--text3);}

/* WINDOW */
.win{position:fixed;display:none;flex-direction:column;border:1px solid var(--border2);border-radius:3px;background:var(--bg2);box-shadow:0 24px 80px rgba(0,0,0,0.85),0 0 0 1px rgba(0,180,216,0.03);overflow:hidden;min-width:440px;min-height:260px;z-index:200;}
.win.show{display:flex;}
/* Resize handles */
.rh{position:absolute;z-index:10;}
.rh-e{right:0;top:4px;bottom:4px;width:5px;cursor:e-resize;}
.rh-w{left:0;top:4px;bottom:4px;width:5px;cursor:w-resize;}
.rh-s{bottom:0;left:4px;right:4px;height:5px;cursor:s-resize;}
.rh-n{top:0;left:4px;right:4px;height:5px;cursor:n-resize;}
.rh-se{right:0;bottom:0;width:10px;height:10px;cursor:se-resize;}
.rh-sw{left:0;bottom:0;width:10px;height:10px;cursor:sw-resize;}
.rh-ne{right:0;top:0;width:10px;height:10px;cursor:ne-resize;}
.rh-nw{left:0;top:0;width:10px;height:10px;cursor:nw-resize;}

/* Title bar */
.w-title{height:28px;flex-shrink:0;cursor:move;user-select:none;background:#080c18;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;padding:0 10px;}
.w-title img{width:12px;height:12px;object-fit:contain;opacity:.6;}
.w-title-txt{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.06em;flex:1;}
.w-btn{width:11px;height:11px;border-radius:50%;border:none;cursor:pointer;transition:opacity .15s;}
.w-btn:hover{opacity:.7;}
.w-btn-min{background:#f59e0b;margin-right:2px;}
.w-btn-max{background:#10b981;margin-right:5px;}
.w-btn-cls{background:#ef4444;}

/* Top bar */
.w-top{height:34px;flex-shrink:0;background:#090e1c;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;}
.w-top-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.2em;text-transform:uppercase;flex:1;}
.w-top-badge{font-family:var(--mono);font-size:8px;color:var(--text3);border:1px solid var(--border);padding:1px 7px;border-radius:1px;}
.w-back{font-family:var(--mono);font-size:9px;color:var(--cyan);border:1px solid var(--cyan2);padding:2px 9px;border-radius:2px;cursor:pointer;background:var(--cyan-dim);transition:background .15s;display:none;}
.w-back:hover{background:rgba(0,180,216,0.16);}
.w-back.show{display:block;}

/* Body + Statusbar */
.w-body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#1a2a42 transparent;}
.w-body::-webkit-scrollbar{width:3px;}
.w-body::-webkit-scrollbar-thumb{background:#1a2a42;}
.w-status{height:24px;flex-shrink:0;background:#040810;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;}
.w-status span{font-family:var(--mono);font-size:8px;color:var(--text3);}

/* MENU TILES */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);height:100%;}
.menu-tile{background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:background .2s;padding:40px;position:relative;overflow:hidden;}
.menu-tile::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--cyan-glow),transparent 70%);opacity:0;transition:opacity .3s;}
.menu-tile:hover{background:#121d30;}
.menu-tile:hover::before{opacity:1;}
.menu-tile-ico{font-size:26px;color:var(--cyan);opacity:.75;}
.menu-tile-name{font-family:var(--ui);font-size:14px;font-weight:700;color:var(--white);letter-spacing:.08em;}
.menu-tile-desc{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:.1em;}

/* ROWS */
.sec-hd{padding:11px 16px 8px;font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid var(--border);}
.row{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;gap:10px;}
.row:hover{background:#0d1525;}
.row-num{font-family:var(--mono);font-size:10px;color:var(--cyan);min-width:32px;}
.row-tag{font-family:var(--mono);font-size:8px;color:var(--text2);background:rgba(0,180,216,0.06);border:1px solid rgba(0,180,216,0.12);padding:1px 6px;border-radius:1px;}
.row-info{font-family:var(--mono);font-size:9px;color:var(--text3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-arr{color:var(--text3);font-size:10px;}

/* BADGES */
.badge{font-family:var(--mono);font-size:8px;padding:2px 7px;border-radius:1px;letter-spacing:.08em;font-weight:600;}
.b-col{background:rgba(0,180,216,0.1);color:var(--cyan);border:1px solid rgba(0,180,216,0.25);}
.b-ana{background:rgba(0,230,118,0.1);color:var(--green);border:1px solid rgba(0,230,118,0.25);}
.b-pnd{background:rgba(255,171,64,0.1);color:var(--orange);border:1px solid rgba(255,171,64,0.25);}
.row-qual{font-family:var(--mono);font-size:9px;color:var(--green);min-width:58px;text-align:right;}

/* DETAIL */
.det-wrap{padding:16px;}
.det-hd{font-family:var(--mono);font-size:10px;color:var(--text2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);}
.det-cell{background:var(--panel);padding:12px 16px;}
.det-cell.full{grid-column:1/-1;}
.det-lbl{font-family:var(--mono);font-size:7px;color:var(--text3);letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px;}
.det-val{font-family:var(--body);font-size:12px;color:var(--white);font-weight:500;}
.det-val.gr{color:var(--green);}
.det-val.cy{color:var(--cyan);}
.det-val.or{color:var(--orange);}
.det-notes{background:var(--panel);border:1px solid var(--border);padding:12px;margin-top:12px;}
.btn-print{width:100%;margin-top:12px;padding:10px;background:var(--cyan-dim);border:1px solid var(--cyan2);color:var(--cyan);font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .15s;border-radius:2px;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-print:hover{background:rgba(0,180,216,0.16);}

/* SEARCH */
.search-wrap{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;}
.search-wrap input{flex:1;background:#0a1220;border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:10px;padding:5px 10px;border-radius:2px;outline:none;}
.search-wrap input:focus{border-color:var(--cyan2);}
.search-wrap input::placeholder{color:var(--text3);}
.search-wrap button{background:var(--cyan-dim);border:1px solid var(--cyan2);color:var(--cyan);padding:5px 10px;border-radius:2px;cursor:pointer;font-size:13px;}

/* RESULTS rows */
.res-row{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;gap:12px;}
.res-row:hover{background:#0d1525;}
.res-preuve{font-family:var(--mono);font-size:10px;color:var(--cyan);min-width:80px;}
.res-type{font-family:var(--mono);font-size:8px;color:var(--text2);background:rgba(0,180,216,0.05);border:1px solid rgba(0,180,216,0.1);padding:1px 5px;border-radius:1px;}
.res-match{font-family:var(--mono);font-size:10px;flex:1;text-align:center;}
.res-match.found{color:var(--green);}
.res-match.none{color:var(--text3);}
.res-date{font-family:var(--mono);font-size:8px;color:var(--text3);}

/* LAB LAYOUT */
.lab-wrap{display:flex;height:100%;}
.lab-side{width:270px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#1a2a42 transparent;}
.lab-side::-webkit-scrollbar{width:3px;}
.lab-side-hd{padding:9px 13px;background:#06090f;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:.18em;text-transform:uppercase;}
.lab-item{padding:9px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.lab-item:hover{background:#0d1525;}
.lab-item.sel{background:#0e1a2e;border-left:2px solid var(--cyan);}
.lab-item-num{font-family:var(--mono);font-size:10px;color:var(--cyan);margin-bottom:2px;}
.lab-item-bar{height:2px;background:var(--border);border-radius:1px;margin-top:4px;overflow:hidden;}
.lab-item-fill{height:100%;border-radius:1px;}
.lab-item-sub{font-family:var(--mono);font-size:8px;color:var(--text3);margin-top:2px;display:flex;align-items:center;justify-content:space-between;}
.lab-main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:#060810;}
.lab-empty{text-align:center;color:var(--text3);font-family:var(--mono);font-size:10px;line-height:2.2;}

/* LAB CARD */
.lab-card{background:var(--panel);border:1px solid var(--border2);border-radius:3px;padding:22px;width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
.lab-card-hd{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);margin-bottom:3px;display:flex;align-items:center;justify-content:space-between;}
.lab-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0;}
.lab-field .lbl{font-family:var(--mono);font-size:7px;color:var(--text3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px;}
.lab-field .val{font-family:var(--body);font-size:12px;color:var(--white);font-weight:500;}
.lab-field .val.cy{color:var(--cyan);}
.btn-launch{width:100%;padding:12px;background:rgba(0,180,216,0.1);border:1px solid var(--cyan);color:var(--cyan);font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .15s;border-radius:2px;display:flex;align-items:center;justify-content:center;gap:7px;}
.btn-launch:hover{background:rgba(0,180,216,0.2);}
.btn-launch:disabled{opacity:.5;cursor:not-allowed;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.spin{display:inline-block;animation:spin 1s linear infinite;}

/* RESULT CARD */
.res-card{background:var(--panel);border:1px solid var(--border2);border-radius:3px;padding:20px;width:400px;}
.res-card-hd{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.res-card-hd .ico{font-size:18px;}
.res-card-hd .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;}
.res-card-hd.match{color:var(--green);}
.res-card-hd.nomatch{color:var(--orange);}
.res-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.res-field .lbl{font-family:var(--mono);font-size:7px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px;}
.res-field .val{font-family:var(--mono);font-size:10px;color:var(--text);}
.res-field .val.gr{color:var(--green);}
.res-rapport{background:var(--bg3);border:1px solid var(--border);border-radius:2px;padding:10px;margin-bottom:12px;}
.res-rapport .lbl{font-family:var(--mono);font-size:7px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px;}
.res-rapport .txt{font-family:var(--body);font-size:11px;color:var(--text);}
.btn-print2{width:100%;padding:9px;background:var(--cyan-dim);border:1px solid var(--cyan2);color:var(--cyan);font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .15s;border-radius:2px;display:flex;align-items:center;justify-content:center;gap:5px;}
.btn-print2:hover{background:rgba(0,180,216,0.16);}

/* FORMS */
.form-wrap{padding:16px;}
.form-row{display:flex;gap:10px;margin-bottom:10px;}
.form-field{flex:1;}
.form-field label{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:4px;}
.form-field input,.form-field select,.form-field textarea{width:100%;background:#0a1220;border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:10px;padding:7px 10px;border-radius:2px;outline:none;transition:border-color .15s;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--cyan2);}
.form-field select{cursor:pointer;}
.form-field textarea{resize:vertical;min-height:60px;}
.btn-submit{padding:9px 20px;background:var(--cyan-dim);border:1px solid var(--cyan2);color:var(--cyan);font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:background .15s;}
.btn-submit:hover{background:rgba(0,180,216,0.18);}
.btn-del{padding:9px 12px;background:var(--red-dim);border:1px solid rgba(239,83,80,0.3);color:var(--red);font-family:var(--mono);font-size:9px;cursor:pointer;border-radius:2px;transition:background .15s;}
.btn-del:hover{background:rgba(239,83,80,0.16);}

/* ALERTS */
.alert{padding:10px 12px;border-radius:2px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.alert.success{background:var(--green-dim);border:1px solid rgba(0,230,118,0.2);color:var(--green);}
.alert.warn{background:var(--orange-dim);border:1px solid rgba(255,171,64,0.2);color:var(--orange);}
.alert.info{background:var(--cyan-dim);border:1px solid rgba(0,180,216,0.2);color:var(--cyan);}

/* Layout plein écran */
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--body);display:flex;flex-direction:column;}

/* Topbar */
#top-bar{
  height:36px;flex-shrink:0;
  background:#08101c;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;
}
#top-bar img{width:18px;height:18px;object-fit:contain;opacity:.7;}
#top-bar-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.2em;text-transform:uppercase;flex:1;}
#top-bar-badge{font-family:var(--mono);font-size:8px;color:var(--text3);border:1px solid var(--border);padding:1px 8px;border-radius:1px;}
#top-bar-status{font-family:var(--mono);font-size:9px;color:var(--text2);}

/* Layout principal: gauche + droite */
#main-layout{display:flex;flex:1;overflow:hidden;}

/* Panneau gauche: saisie */
#left-panel{
  width:320px;flex-shrink:0;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  background:#060810;
}
#left-header{
  padding:10px 14px;border-bottom:1px solid var(--border);
  font-family:var(--mono);font-size:8px;color:var(--text3);
  letter-spacing:.18em;text-transform:uppercase;
  display:flex;align-items:center;gap:6px;
}
#reader-input{
  flex:1;background:transparent;border:none;outline:none;
  resize:none;padding:14px;
  font-family:var(--mono);font-size:10px;color:var(--text);line-height:1.7;
}
#reader-input::placeholder{color:var(--text3);}
#left-actions{
  padding:10px 14px;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:6px;
}
#btn-format{
  width:100%;padding:10px;
  background:var(--cyan-dim);border:1px solid var(--cyan2);color:var(--cyan);
  font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  cursor:pointer;border-radius:2px;transition:background .15s;
}
#btn-format:hover{background:rgba(0,180,216,0.18);}
#btn-clear{
  width:100%;padding:7px;
  background:transparent;border:1px solid var(--border2);color:var(--text3);
  font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;border-radius:2px;transition:all .15s;
}
#btn-clear:hover{border-color:var(--text3);color:var(--text2);}

/* Panneau droit: aperçu */
#right-panel{
  flex:1;overflow-y:auto;
  background:#f5f0e8;
  scrollbar-width:thin;scrollbar-color:#c0b89a #f5f0e8;
}
#right-panel::-webkit-scrollbar{width:4px;}
#right-panel::-webkit-scrollbar-thumb{background:#c0b89a;border-radius:2px;}

/* Statusbar */
#status-bar{
  height:24px;flex-shrink:0;
  background:#040810;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;
}
#status-bar span{font-family:var(--mono);font-size:8px;color:var(--text3);}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="top-bar">
  <img src="for_logo.png" onerror="this.style.display='none'">
  <span id="top-bar-lbl">Lecteur & Formateur de Rapports Forensiques</span>
  <span id="top-bar-badge">LSPD / BCSO</span>
</div>

<!-- MAIN LAYOUT -->
<div id="main-layout">

  <!-- GAUCHE: saisie -->
  <div id="left-panel">
    <div id="left-header">📋 Coller le rapport brut</div>
    <textarea id="reader-input" placeholder="Collez ici le rapport brut...&#10;&#10;Le formatage sera généré&#10;automatiquement."></textarea>
    <div id="left-actions">
      <button id="btn-format" onclick="parseReport()">✦ Formater le rapport</button>
      <button id="btn-clear" onclick="clearReader()">✕ Effacer</button>
    </div>
  </div>

  <!-- DROITE: aperçu formaté -->
  <div id="right-panel">
    <div id="reader-preview" style="min-height:100%;">
      <div class="rdr-empty">
        Collez un rapport dans le panneau de gauche<br>
        puis cliquez <strong>✦ Formater le rapport</strong>
      </div>
    </div>
  </div>

</div>

<!-- STATUSBAR -->
<div id="status-bar">
  <span>📄 LSPD — Lecteur de Rapports Forensiques</span>
  <span id="reader-sr">Prêt</span>
</div>

<script>
function clearReader(){
  document.getElementById('reader-input').value='';
  document.getElementById('reader-preview').innerHTML='<div class="rdr-empty">Collez un rapport dans le panneau de gauche<br>puis cliquez <strong>✦ Formater le rapport</strong></div>';
  document.getElementById('reader-sr').textContent='Prêt';
}

function parseReport(){
  var raw = document.getElementById('reader-input').value.trim();
  if(!raw){ document.getElementById('reader-sr').textContent='Aucun texte à formater'; return; }

  function extract(patterns, text){
    for(var i=0;i<patterns.length;i++){
      var m=text.match(patterns[i]);
      if(m) return (m[1]||m[0]).trim();
    }
    return null;
  }

  var ref      = extract([/RAPPORT D['']ANALYSE N\.?\s*([A-Z0-9\-]+)/i,/Ref[:\s]+([A-Z0-9\-]+)/i], raw) || genRef();
  var nature   = extract([/Nature de la preuve\s*[.]+\s*(.+)/i,/Type[\s:.]+(.+)/i], raw) || 'Échantillon ADN';
  var preuve   = extract([/R[eé]f[eé]rence\s*[.]+\s*(.+)/i], raw) || extract([/Preuve\s*#?(\d+)/i], raw);
  var lieu     = extract([/Lieu de collect[e]\s*[.]+\s*(.+)/i], raw) || '—';
  var coords   = extract([/Coordonn[eé]es\s*[.]+\s*(.+)/i], raw) || '—';
  var datec    = extract([/Date de collect[e]\s*[.]+\s*(.+)/i], raw) || '—';
  var qualite  = extract([/Qualit[eé] de l.?[eé]chantillon\s*[.]* *(\d+[\d.,]*)%?/i,/QUALIT[EÉ][\s:.]+(\d+)/i], raw) || '—';

  // Résultat = suspect (ligne "Correspondance retroactive: NOM")
  var resultat = extract([/Correspondance\s+r[ée]troactive\s*:\s*(.+)/i,/Suspect\s*:\s*(.+)/i], raw);

  // Analyste = celui qui a effectué l'analyse (chercher "Analyse - NOM[ID]" dans chain of custody)
  var analyste = extract([/Analyse\s*-\s*([A-Za-z_]+\[\d+\])\s*-/i], raw);
  if(!analyste) analyste = extract([/Analyste\s*[:\-]\s*(.+)/i], raw) || '—';

  // Signataire (ligne isolée "NOM[ID]" avant "Technicien")
  var sig = '—';
  var sigMatch = raw.match(/^([A-Za-z_]+\[\d+\])\s*\n\s*Technicien/m);
  if(sigMatch) sig = sigMatch[1].trim();
  else {
    var sigMatch2 = raw.match(/^([A-Za-z_]+\[\d+\])\s*$/m);
    if(sigMatch2) sig = sigMatch2[1].trim();
    else if(analyste !== '—') sig = analyste;
  }

  var dateGen = extract([/Fait [aà] Los Santos,? le (.+)/i], raw)
    || (new Date().toLocaleDateString('fr-FR')+' à '+new Date().toLocaleTimeString('fr-FR').slice(0,5));

  var isMatch = !!resultat;

  // Chaine de custody
  var chain = [];
  raw.split('\n').forEach(function(l){
    var t=l.trim();
    if(!t) return;
    if(t.match(/Collect[e]/i) && t.match(/\d{2}\/\d{2}\/\d{4}/)) chain.push({type:'Collecte',txt:t,cls:'collecte'});
    else if(t.match(/Analyse/i) && t.match(/\d{2}\/\d{2}\/\d{4}/) && !t.match(/Match|Suspect/i)) chain.push({type:'Analyse',txt:t,cls:'analyse'});
    else if((t.match(/Match/i)||t.match(/Suspect/i)) && t.match(/\d{2}\/\d{2}\/\d{4}/)) chain.push({type:'Match',txt:t,cls:'match'});
  });

  // Mentions légales
  var legalM = raw.match(/IV\.[^\n]*\n([\s\S]*?)(?:Fait [aà]|$)/i);
  var legal = legalM ? legalM[1].trim().split('\n').filter(function(l){return l.trim();}).join(' ')
    : "Le présent rapport a été établi conformément aux procédures du LSPD. Toute falsification, modification ou reproduction non autorisée est passible de poursuites pénales.";

  var chainHtml = '';
  if(chain.length){
    chainHtml = '<div class="rdr-card rdr-card-full">'
      + '<div class="rdr-card-label">III — CHAINE DE CUSTODY</div>'
      + '<div class="rdr-custody-badge">✓ Chaîne de custody vérifiée — Intègre</div>'
      + '<div class="rdr-chain-list">'
      + chain.map(function(item){
          return '<div class="rdr-chain-item rdr-chain-'+item.cls+'">'
            + '<div class="rdr-chain-dot"></div>'
            + '<div class="rdr-chain-type">'+item.type+'</div>'
            + '<div class="rdr-chain-txt">'+item.txt+'</div>'
            + '</div>';
        }).join('')
      + '</div></div>';
  }

  var html = '<button class="rdr-print-btn" onclick="printOnlyReport()">🖨 &nbsp; IMPRIMER LE RAPPORT</button>'
    + '<div class="rdr-doc">'

    // EN-TÊTE
    + '<div class="rdr-top">'
    +   '<div class="rdr-top-logos">'
    +     '<img src="ciu_logo.png" class="rdr-logo" onerror="this.style.display=\'none\'">'
    +     '<div class="rdr-top-text">'
    +       '<div class="rdr-top-title">LOS SANTOS POLICE DEPARTMENT</div>'
    +       '<div class="rdr-top-sub">Criminal Investigation Division</div>'
    +       '<div class="rdr-top-sub">Laboratoire de Police Scientifique</div>'
    +     '</div>'
    +     '<img src="ciu_logo.png" class="rdr-logo" onerror="this.style.display=\'none\'">'
    +   '</div>'
    +   '<div class="rdr-top-divider"></div>'
    +   '<div class="rdr-ref-box">'
    +     '<span class="rdr-ref-label">RAPPORT D\'ANALYSE N.</span>'
    +     '<span class="rdr-ref-num">'+ref+'</span>'
    +   '</div>'
    + '</div>'

    // GRILLE
    + '<div class="rdr-main-grid">'

    // I - OBJET
    + '<div class="rdr-card rdr-card-full">'
    +   '<div class="rdr-card-label">I — OBJET DE L\'ANALYSE</div>'
    +   '<div class="rdr-card-grid4">'
    +     '<div class="rdr-field"><div class="rdr-field-lbl">Nature de la preuve</div><div class="rdr-field-val">'+nature+'</div></div>'
    +     (preuve ? '<div class="rdr-field"><div class="rdr-field-lbl">Référence</div><div class="rdr-field-val">'+preuve+'</div></div>' : '')
    +     '<div class="rdr-field"><div class="rdr-field-lbl">Lieu de collecte</div><div class="rdr-field-val">'+lieu+'</div></div>'
    +     '<div class="rdr-field"><div class="rdr-field-lbl">Coordonnées GPS</div><div class="rdr-field-val rdr-coords">📍 '+coords+'</div></div>'
    +     '<div class="rdr-field"><div class="rdr-field-lbl">Date de collecte</div><div class="rdr-field-val">'+datec+'</div></div>'
    +     '<div class="rdr-field"><div class="rdr-field-lbl">Qualité de l\'échantillon</div><div class="rdr-field-val rdr-quality">'+qualite+'%</div></div>'
    +   '</div>'
    + '</div>'

    // II - RÉSULTAT
    + '<div class="rdr-card rdr-card-result '+(isMatch?'rdr-card-match':'rdr-card-nomatch')+'">'
    +   '<div class="rdr-card-label">II — RÉSULTAT DE L\'ANALYSE</div>'
    +   '<div class="rdr-result-inner">'
    +     '<div class="rdr-result-icon">'+(isMatch?'✓':'✗')+'</div>'
    +     '<div>'
    +       '<div class="rdr-result-label">'+(isMatch?'CORRESPONDANCE TROUVÉE':'AUCUNE CORRESPONDANCE')+'</div>'
    +       '<div class="rdr-result-val">'+(resultat||'Inconnu — aucun individu correspondant dans la base de données')+'</div>'
    +     '</div>'
    +   '</div>'
    + '</div>'

    // ANALYSTE
    + '<div class="rdr-card">'
    +   '<div class="rdr-card-label">Analyste</div>'
    +   '<div class="rdr-field-val rdr-analyst">'+sig+'</div>'
    +   '<div class="rdr-analyst-title">Technicien de Police Scientifique</div>'
    + '</div>'

    // III - CHAINE
    + chainHtml

    // IV - LÉGAL
    + '<div class="rdr-card rdr-card-full">'
    +   '<div class="rdr-card-label">IV — MENTIONS LÉGALES</div>'
    +   '<div class="rdr-legal-txt">'+legal+'</div>'
    + '</div>'

    + '</div>' // rdr-main-grid

    // SIGNATURE
    + '<div class="rdr-sig-section">'
    +   '<div class="rdr-sig-left"><div class="rdr-sig-city">Fait à Los Santos, le '+dateGen+'</div></div>'
    +   '<div class="rdr-sig-right">'
    +     '<div class="rdr-sig-name">'+sig+'</div>'
    +     '<div class="rdr-sig-title">Technicien de Police Scientifique</div>'
    +     '<div class="rdr-sig-ref">Réf: '+ref+'</div>'
    +   '</div>'
    + '</div>'

    // PIED DE PAGE
    + '<div class="rdr-footer">'
    +   '<div class="rdr-footer-line1">LSPD — Criminal Investigation Union &nbsp;·&nbsp; Document officiel — Toute falsification est un délit</div>'
    +   '<div class="rdr-footer-line2">LSPD — Criminal Investigation Division &nbsp;·&nbsp; Laboratoire de Police Scientifique</div>'
    + '</div>'

    + '</div>'; // rdr-doc

  document.getElementById('reader-preview').innerHTML = html;
  document.getElementById('reader-sr').textContent = 'Rapport formaté — Réf. ' + ref;
}

function genRef(){
  var chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  var suffix='';
  for(var i=0;i<8;i++) suffix+=chars[Math.floor(Math.random()*chars.length)];
  return 'RPT-'+Math.floor(Math.random()*90+10)+'-'+suffix;
}

function printOnlyReport(){
  const doc = document.querySelector('.rdr-doc');
  if(!doc){ alert('Aucun rapport à imprimer.'); return; }
  const pw = window.open('','_blank','width=900,height=800');
  const styles = Array.from(document.styleSheets).map(ss=>{
    try{ return Array.from(ss.cssRules).map(r=>r.cssText).join('\n'); }catch(e){ return ''; }
  }).join('\n');
  const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Rapport</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">'
    + '<style>*{box-sizing:border-box;margin:0;padding:0;}'
    + 'body{background:#f4f1eb;font-family:Georgia,serif;color:#1a1a1a;}'
    + styles
    + '.rdr-print-btn{display:none!important;}'
    + '</style>'
    + '</head><body>'
    + '<div class="rdr-doc">' + doc.innerHTML.replace(/<button[^>]*rdr-print-btn[^>]*>.*?<\/button>/gi,'') + '</div>'
    + '<scr'+'ipt>setTimeout(function(){window.print();},400);<'+'/scr'+'ipt>'
    + '</body></html>';
  pw.document.write(html);
  pw.document.close();
}

function printRapport(id){
  const p = DATA.preuves.find(x => x.id === id);
  if(!p) return;
  const w = window.open('','_blank');
  const lines = [
    '<!DOCTYPE html><html><head><meta charset="UTF-8">',
    '<title>Rapport Preuve #' + p.id + '</title>',
    '<style>body{font-family:monospace;background:#fff;color:#000;padding:40px;max-width:680px;margin:auto;}',
    '.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;border:1px solid #ccc;padding:14px;margin:12px 0;}',
    '.field .l{font-size:8px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}',
    '.match{color:green;font-weight:700;}.none{color:#aaa;}',
    '.box{border:1px solid #ccc;padding:10px;margin-top:10px;}',
    '</style></head><body>',
    '<div style="border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:16px;">',
    '<div style="font-size:9px;color:#666;letter-spacing:2px;text-transform:uppercase;">LSPD / BCSO — Base de Données Forensique</div>',
    '<h1 style="font-size:16px;margin:4px 0 0;">RAPPORT — PREUVE #' + p.id + '</h1>',
    '</div>',
    '<div class="grid">',
    '<div class="field"><div class="l">TYPE</div><div>' + p.type + '</div></div>',
    '<div class="field"><div class="l">QUALITÉ</div><div class="match">' + Number(p.qualite).toFixed(4) + '%</div></div>',
    '<div class="field"><div class="l">STATUT</div><div>' + p.statut + '</div></div>',
    '<div class="field"><div class="l">SOURCE</div><div>' + p.source + '</div></div>',
    '<div class="field"><div class="l">POSITION</div><div>' + p.coords + '</div></div>',
    '<div class="field"><div class="l">DATE COLLECTE</div><div>' + p.dateCollecte + '</div></div>',
    '<div class="field"><div class="l">RÉSULTAT</div><div class="' + (p.resultat?'match':'none') + '">' + (p.resultat||'Pas de correspondance') + '</div></div>',
    '<div class="field"><div class="l">ANALYSTE</div><div>' + (p.analyste||'—') + '</div></div>',
    '</div>',
    p.rapport ? '<div class="box"><div style="font-size:8px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;">RAPPORT</div><div>' + p.rapport + '</div></div>' : '',
    '<div style="margin-top:24px;font-size:9px;color:#aaa;border-top:1px solid #eee;padding-top:8px;">© LSPD / BCSO — Criminal Investigation Union</div>',
    '</body></html>'
  ];
  w.document.open();
  lines.forEach(function(l){ w.document.write(l); });
  w.document.close();
  setTimeout(function(){ w.print(); }, 500);
}
</script>
</body>
</html>
